# Builds this custom PocketCW on Linux on every push to main and publishes it as the newest release, so
# get-mine.sh can install it with no Rust on the Mac. A push to dev only builds. The logs go to
# the build-log-<branch> branch.
name: build my firmware

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mine
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add thumbv7em-none-eabihf
          rustup component add llvm-tools

      - name: Test the logic
        run: (cd logic && cargo test) 2>&1 | tee test.log

      - name: Build the firmware
        run: |
          sh tools/mkimage.sh 2>&1 | tee build.log
          # RAM is 64 KB, and the stack gets what .data and .bss leave.
          size=$(dirname "$(ls ~/.rustup/toolchains/*/lib/rustlib/*/bin/llvm-size | head -1)")/llvm-size
          "$size" -A firmware/target/thumbv7em-none-eabihf/release/pocketcw-firmware 2>&1 | tee -a build.log

      # The Mac install tool is unchanged from upstream, so the build takes its v0.4.0 copy and
      # needs no Mac runner.
      - name: Get the install tool
        run: curl -fsSL -o pocketcw-flash https://github.com/kvmet/k5mme_pocketcw/releases/download/v0.4.0/pocketcw-flash

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mine-${{ github.run_number }}" firmware/target/A000014.bin pocketcw-flash \
            --title "My PocketCW, build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/get-mine.sh | sh" \
            --latest

      - name: Save the logs to the build-log branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          cp ./*.log "$RUNNER_TEMP/log/" 2>/dev/null || true
          echo "${{ job.status }} run ${{ github.run_number }} commit ${{ github.sha }}" > "$RUNNER_TEMP/log/status.txt"
          cd "$RUNNER_TEMP/log"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Logs of build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:build-log-${{ github.ref_name }}
